name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>&1 || { echo "Install failed"; pip install -e . && pip install pytest pytest-asyncio; }

      - name: Run lightweight tests (no GPU/heavy deps)
        env:
          MULTIHEAD_CI: "1"
        run: |
          python -m pytest tests/0-nano -v --tb=short -x \
            --ignore=tests/0-nano/test_embedding_search.py \
            --ignore=tests/0-nano/test_shell.py \
            --ignore=tests/0-nano/test_shell_commands.py \
            -k "not sdk_mcp and not claude_agent"

      - name: Check import
        run: |
          python -c "import multihead; print('Import OK')"
