# RTX 4090 / 24GB+ VRAM configuration
# Supports Qwen3-8B LLM + Qwen3-VL-32B VLM with 4-bit quantization
# Requires: pip install torch transformers accelerate bitsandbytes

heads:
  # --- Testing (always available) ---
  - head_id: mock-llm
    name: Mock LLM
    adapter: mock
    model: mock-llm-v1
    kind: llm
    gpu_required: false

  - head_id: mock-vlm
    name: Mock VLM
    adapter: mock
    model: mock-vlm-v1
    kind: vlm
    gpu_required: false

  # --- Local LLM (primary brain) ---
  - head_id: core-llm
    name: Qwen3 8B
    adapter: transformers
    model: Qwen/Qwen3-8B
    kind: llm
    gpu_required: true
    vram_hint_mb: 6000
    quantization: "4bit"

  # --- Local VLM (vision analysis) ---
  - head_id: vision-vlm
    name: Qwen3 VL 32B Thinking
    adapter: transformers
    model: Qwen/Qwen3-VL-32B-Thinking
    kind: vlm
    gpu_required: true
    vram_hint_mb: 18000
    quantization: "4bit"

  # --- Claude via Agent SDK (uses system claude CLI with your subscription) ---
  - head_id: claude-sdk
    name: Claude SDK
    adapter: claude_agent_sdk
    model: claude-sonnet-4-6
    kind: llm
    gpu_required: false

  # --- Uncomment if you have an OpenAI API key ---
  # - head_id: openai-gpt4o
