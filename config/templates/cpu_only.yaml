# CPU-only configuration (no GPU required)
# Uses mock heads for testing + optional API-based heads

heads:
  # --- Testing (always available) ---
  - head_id: mock-llm
    name: Mock LLM
    adapter: mock
    model: mock-llm-v1
    kind: llm
    gpu_required: false

  - head_id: mock-vlm
    name: Mock VLM
    adapter: mock
    model: mock-vlm-v1
    kind: vlm
    gpu_required: false

