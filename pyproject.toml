[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multihead"
version = "2.0.0"
description = "Framework for building persistent AI specialists that verify, store, and reuse knowledge over time"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Axsar"}]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "python-ulid>=2.0",
    "aiosqlite>=0.20",
    "aiofiles>=24.0",
    "python-multipart>=0.0.9",
    "fastmcp>=2.14",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
]
claude = [
    "claude-agent-sdk>=0.1.0",
]
mesh = [
    "zeroconf>=0.131",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[project.scripts]
multihead = "multihead.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multihead = ["default_config/**/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
