# MultiHead head registry — safe defaults (no GPU required)
# Run `multihead init --auto` to detect your hardware and enable GPU heads.
# Or manually uncomment the heads below if you have the right dependencies.

heads:
  # --- Always available (no dependencies) ---
  - head_id: mock-llm
    name: Mock LLM
    adapter: mock
    model: mock-llm-v1
    kind: llm
    gpu_required: false

  - head_id: mock-vlm
    name: Mock VLM
    adapter: mock
    model: mock-vlm-v1
    kind: vlm
    gpu_required: false

